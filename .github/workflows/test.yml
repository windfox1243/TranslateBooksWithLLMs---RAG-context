name: Test

on:
  workflow_call:
  pull_request:
    branches: [main, global-context-experiment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Check Python syntax
        run: pre-commit run --all-files check-ast

      - name: Check YAML syntax
        run: pre-commit run --all-files check-yaml

      # The whole tree was sorted in one pass, so this is enforceable from here
      # on. isort is pinned to 5.13.2 in .pre-commit-config.yaml; sorting with a
      # different version locally can produce a diff this job rejects.
      - name: Check import order
        run: pre-commit run --all-files isort

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run test suite
        run: pytest -q
